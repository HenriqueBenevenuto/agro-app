        if(a) openAluguelModal(a);
      });
    });
    root.querySelectorAll('[data-act="encerrar-aluguel-h"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var a = state.alugueis.filter(function(x){ return String(x.rowIndex) === btn.dataset.row; })[0];
        api("encerrarAluguel", { rowIndex: a.rowIndex }).then(function(){
          toast("Máquina marcada como devolvida.");
          loadAlugueis();
        }).catch(function(err){ toast(err.message, "err"); });
      });
    });
    root.querySelectorAll('[data-act="reabrir-aluguel-h"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var a = state.alugueis.filter(function(x){ return String(x.rowIndex) === btn.dataset.row; })[0];
        api("reabrirAluguel", { rowIndex: a.rowIndex }).then(function(){
          toast("Aluguel reaberto.");
          loadAlugueis();
        }).catch(function(err){ toast(err.message, "err"); });
      });
    });
    root.querySelectorAll('[data-act="del-aluguel-h"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var a = state.alugueis.filter(function(x){ return String(x.rowIndex) === btn.dataset.row; })[0];
        confirmModal("Remover aluguel", "Remover esse registro de aluguel da planilha? Essa ação não pode ser desfeita.", "Remover", function(){
          var rowIndex = a.rowIndex;
          state.alugueis = state.alugueis.filter(function(x){ return x.rowIndex !== rowIndex; });
          renderAlugueis();
          renderHistoricoMaquinas();
          toast("Aluguel removido.");
          api("deleteAluguel", { rowIndex: rowIndex }).catch(function(err){
            toast("Não foi possível remover: " + err.message, "err");
            loadAlugueis();
          });
        }, true);
      });
    });
  }

  // ---- Aba Cadastro (máquinas) ----
  function filteredCadastroMaquinas(){
    return state.maquinas.filter(function(m){
      if(state.buscaCadastroMaquinas){
        var q = state.buscaCadastroMaquinas.toLowerCase();
        var hay = (m.nome + " " + (m.marca||"")).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function(a,b){ return (a.nome||"").localeCompare(b.nome||""); });
  }

  function renderCadastroMaquinas(){
    var root = document.getElementById("viewCadastroMaquinas");
    if(!root) return;
    var html = '';
    html += '<div class="toolbar">';
    html += '  <div class="search-box">'+ICON.search+'<input type="text" id="cmBusca" placeholder="Buscar máquina ou marca" value="'+escapeHtml(state.buscaCadastroMaquinas)+'"></div>';
    html += '  <div class="spacer"></div>';
    html += '  <button class="btn btn-primary" id="btnNovaMaquina">'+ICON.plus+' Nova máquina</button>';
    html += '</div>';

    html += '<div class="card">';
    if(state.loadingMaquinas){
      html += '<div class="loading-row"><div class="spinner spinner-dark"></div>Carregando...</div>';
    } else {
      var list = filteredCadastroMaquinas();
      if(list.length === 0){
        html += emptyState(ICON.box, "Nenhuma máquina cadastrada", state.maquinas.length===0 ? "Cadastre a primeira máquina pra poder registrar aluguéis." : "Ajuste a busca ou cadastre uma nova máquina.");
      } else {
        html += '<table><thead><tr><th>Nome</th><th>Marca</th><th>Valor/dia</th><th></th></tr></thead><tbody>';
        list.forEach(function(m){
          html += '<tr>';
          html += '<td data-label="Nome">'+escapeHtml(m.nome)+'</td>';
          html += '<td data-label="Marca" class="cell-sub">'+escapeHtml(m.marca||"—")+'</td>';
          html += '<td data-label="Valor/dia">'+formatMoeda(m.valorDia)+'</td>';
          html += '<td><div class="row-actions">';
          html += '<button class="btn btn-icon btn-sm" data-act="edit-maquina" data-row="'+m.rowIndex+'" title="Editar">'+ICON.edit+'</button>';
          html += '<button class="btn btn-icon btn-sm btn-danger-ghost" data-act="del-maquina" data-row="'+m.rowIndex+'" title="Remover">'+ICON.trash+'</button>';
          html += '</div></td>';
          html += '</tr>';
        });
        html += '</tbody></table>';
      }
    }
    html += '</div>';
    root.innerHTML = html;

    document.getElementById("countCadastroMaquinas").textContent = state.maquinas.length;

    document.getElementById("btnNovaMaquina").addEventListener("click", function(){ openMaquinaCadastroModal(null); });
    var cmBusca = document.getElementById("cmBusca");
    cmBusca.addEventListener("input", function(e){ state.buscaCadastroMaquinas = e.target.value; renderCadastroMaquinas(); preserveFocus(cmBusca); });

    root.querySelectorAll('[data-act="edit-maquina"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var m = state.maquinas.filter(function(x){ return String(x.rowIndex) === btn.dataset.row; })[0];
        if(m) openMaquinaCadastroModal(m);
      });
    });
    root.querySelectorAll('[data-act="del-maquina"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var m = state.maquinas.filter(function(x){ return String(x.rowIndex) === btn.dataset.row; })[0];
        confirmModal("Remover máquina", "Remover \""+escapeHtml(m?m.nome:"")+"\" do cadastro? Aluguéis já registrados não são afetados.", "Remover", function(){
          api("deleteMaquina", { rowIndex: m.rowIndex }).then(function(){
            toast("Máquina removida.");
            loadMaquinas();
          }).catch(function(err){ toast(err.message, "err"); });
        }, true);
      });
    });
  }

  function openMaquinaCadastroModal(maquina){
    var editing = !!(maquina && maquina.rowIndex);
    var marcasExistentes = Array.from(new Set(state.maquinas.map(function(m){ return m.marca; }).filter(Boolean))).sort();
    var html = '<div class="overlay" id="modalOverlay"><div class="modal modal-sm">';
    html += '<div class="modal-head"><h2>'+(editing?"Editar máquina":"Nova máquina")+'</h2><button class="icon-btn" id="mClose" style="color:var(--ink);border-color:var(--line-strong);background:var(--surface-2);">'+ICON.close+'</button></div>';
    html += '<div class="field"><label>Nome</label><input type="text" id="mqNome" placeholder="Ex: Roçadeira" value="'+escapeHtml(editing?maquina.nome:"")+'"></div>';
    html += '<div class="field"><label>Marca (opcional)</label><input type="text" id="mqMarca" list="mqMarcaLista" placeholder="Ex: Stihl" value="'+escapeHtml(editing?maquina.marca:"")+'">';
    html += '<datalist id="mqMarcaLista">'+marcasExistentes.map(function(mk){ return '<option value="'+escapeHtml(mk)+'">'; }).join("")+'</datalist></div>';
    html += '<div class="field"><label>Valor por dia (R$)</label><input type="number" min="0" step="0.01" id="mqValorDia" value="'+(editing?Number(maquina.valorDia).toFixed(2):"0.00")+'"></div>';
    html += '<div class="modal-actions"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">'+(editing?"Salvar alterações":"Adicionar")+'</button></div>';
    html += '</div></div>';
    document.getElementById("modalRoot").innerHTML = html;

    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mCancel").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", function(e){ if(e.target.id === "modalOverlay") closeModal(); });
    document.getElementById("mSave").addEventListener("click", function(){
      var nome = document.getElementById("mqNome").value.trim();
      if(!nome){ toast("Informe o nome da máquina.", "err"); return; }
      var marca = document.getElementById("mqMarca").value.trim();
      var valorDia = Number(document.getElementById("mqValorDia").value);
      if(isNaN(valorDia) || valorDia < 0){ toast("Informe um valor válido.", "err"); return; }
      var payload = { rowIndex: editing ? maquina.rowIndex : undefined, nome: nome, marca: marca, valorDia: valorDia };
      var btn = document.getElementById("mSave");
      btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
      var call = editing ? api("updateMaquina", payload) : api("addMaquina", payload);
      call.then(function(resultData){
        toast(editing ? "Máquina atualizada." : "Máquina cadastrada.");
        closeModal();
        if(editing){
          var idx = state.maquinas.findIndex(function(x){ return x.rowIndex === maquina.rowIndex; });
          var atualizado = { rowIndex: maquina.rowIndex, nome: nome, marca: marca, valorDia: valorDia };
          if(idx > -1){ state.maquinas[idx] = atualizado; } else { state.maquinas.push(atualizado); }
        } else {
          state.maquinas.push({ rowIndex: resultData && resultData.rowIndex, nome: nome, marca: marca, valorDia: valorDia });
        }
        renderCadastroMaquinas();
        renderAlugueis();
        renderHistoricoMaquinas();
        loadMaquinas();
      }).catch(function(err){
        toast(err.message, "err");
        btn.disabled = false; btn.textContent = editing ? "Salvar alterações" : "Adicionar";
      });
    });
  }

  function preserveFocus(el){
    var val = el.value;
    setTimeout(function(){
      var again = document.getElementById(el.id);
      if(!again) return;
      again.focus();
      again.value = val;
      // setSelectionRange não é suportado em inputs type="number"/"date" (o navegador
      // lança um erro) — sem essa proteção, o cursor volta pro início a cada tecla
      // e os dígitos digitados saem invertidos.
      try { again.setSelectionRange(val.length, val.length); } catch(e){}
    }, 0);
  }

  function emptyState(icon, title, body){
    return '<div class="empty">'+icon+'<h3>'+title+'</h3><p>'+body+'</p></div>';
  }

  // ---------------------------------------------------------------
  // MODAL: NOVO / EDITAR PEDIDO
  // ---------------------------------------------------------------
  function openPedidoModal(pedidoGroup){
    var editing = !!(pedidoGroup && pedidoGroup.pedidoId);
    var itens = pedidoGroup && pedidoGroup.itens && pedidoGroup.itens.length
      ? pedidoGroup.itens.map(function(it){ return { categoria: it.categoria, subtipo: it.subtipo || "", qtd: it.qtd }; })
      : [{ categoria: CATEGORIAS[0].nome, subtipo: "", qtd: 1 }];

    var html = '<div class="overlay" id="modalOverlay"><div class="modal modal-pedido">';
    html += '<div class="modal-head"><h2>'+(editing?"Editar pedido":"Novo pedido")+'</h2><button class="icon-btn" id="mClose" style="color:var(--ink);border-color:var(--line-strong);background:var(--surface-2);">'+ICON.close+'</button></div>';

    html += '<div class="field autocomplete">';
    html += '<label>Cliente</label>';
    html += '<input type="text" id="pNome" placeholder="Nome do cliente" value="'+escapeHtml(pedidoGroup?pedidoGroup.nome:"")+'" autocomplete="off">';
    html += '<div id="pAutocomplete"></div>';
    html += '</div>';

    html += '<div class="field-row">';
    html += '<div class="field"><label>Telefone</label><input type="tel" id="pTelefone" placeholder="(54) 99999-9999" value="'+escapeHtml(pedidoGroup?pedidoGroup.telefone:"")+'"></div>';
    html += '<div class="field"><label>Município</label><input type="text" id="pMunicipio" placeholder="Município" value="'+escapeHtml(pedidoGroup?pedidoGroup.municipio:"")+'"></div>';
    html += '</div>';

    html += '<div class="field"><label>Endereço</label><input type="text" id="pEndereco" placeholder="Endereço completo" value="'+escapeHtml(pedidoGroup?pedidoGroup.endereco:"")+'"></div>';

    html += '<label class="itens-label">Tipos de ave neste pedido</label>';
    html += '<div id="pItensWrap"></div>';
    html += '<button type="button" class="btn btn-sm" id="btnAddItem" style="margin-bottom:16px;">'+ICON.plus+' Adicionar outro tipo de ave</button>';

    html += '<div class="field"><label>Observações</label><input type="text" id="pObs" placeholder="Opcional" value="'+escapeHtml(pedidoGroup?pedidoGroup.observacoes:"")+'"></div>';

    html += '<div class="pedido-total-row"><span>Total do pedido</span><span id="pTotalValor" class="pedido-total-valor">R$ 0,00</span></div>';

    html += '<div class="modal-actions">';
    html += '<button class="btn" id="mCancel">Cancelar</button>';
    html += '<button class="btn btn-primary" id="mSave">'+(editing?"Salvar alterações":"Criar pedido")+'</button>';
    html += '</div></div></div>';

    document.getElementById("modalRoot").innerHTML = html;

    function categoriaFor(nome){
      return CATEGORIAS.filter(function(c){ return c.nome === nome; })[0] || CATEGORIAS[0];
    }

    function recalcularTotal(){
      var total = itens.reduce(function(s, it){ return s + (Number(it.qtd)||0) * precoDe(it.categoria); }, 0);
      document.getElementById("pTotalValor").textContent = formatMoeda(total);
    }

    function renderItens(){
      var wrap = document.getElementById("pItensWrap");
      var html2 = itens.map(function(it, idx){
        var c = categoriaFor(it.categoria);
        var preco = precoDe(it.categoria);
        var linha = '<div class="item-linha" data-idx="'+idx+'">';
        linha += '<div class="item-linha-top">';
        linha += '<select class="itCategoria" data-idx="'+idx+'">'+CATEGORIAS.map(function(cc){
          return '<option value="'+escapeHtml(cc.nome)+'"'+(cc.nome===it.categoria?' selected':'')+'>'+escapeHtml(cc.nome)+'</option>';
        }).join("")+'</select>';
        linha += '<input type="text" inputmode="numeric" class="itQtd" id="itQtd_'+idx+'" data-idx="'+idx+'" value="'+(it.qtd===0||it.qtd===undefined||it.qtd===null?"":it.qtd)+'" placeholder="Qtd">';
        if(itens.length > 1){
          linha += '<button type="button" class="btn btn-icon btn-sm btn-danger-ghost itRemove" data-idx="'+idx+'" title="Remover este tipo">'+ICON.trash+'</button>';
        }
        linha += '</div>';
        if(c.subtipoLabel){
          var opts = '<option value="">'+escapeHtml(c.subtipoLabel)+': selecione</option>' + c.opcoes.map(function(o){
            return '<option value="'+escapeHtml(o)+'"'+(o===it.subtipo?' selected':'')+'>'+escapeHtml(o)+'</option>';
          }).join("") + '<option value="__outro__"'+(it.subtipo && c.opcoes.indexOf(it.subtipo)===-1 ? ' selected':'')+'>Outro...</option>';
          linha += '<select class="itSubtipo" data-idx="'+idx+'">'+opts+'</select>';
          var isOutro = it.subtipo && c.opcoes.indexOf(it.subtipo) === -1;
          linha += '<input type="text" class="itSubtipoOutro" data-idx="'+idx+'" placeholder="Especifique" style="margin-top:6px;'+(isOutro?'':'display:none;')+'" value="'+(isOutro?escapeHtml(it.subtipo):'')+'">';
        }
        linha += '<div class="item-linha-valor">'+it.qtd+' x '+formatMoeda(preco)+' = <b>'+formatMoeda((Number(it.qtd)||0)*preco)+'</b></div>';
        linha += '</div>';
        return linha;
      }).join("");
      wrap.innerHTML = html2;

      wrap.querySelectorAll(".itCategoria").forEach(function(sel){
        sel.addEventListener("change", function(){
          var idx = Number(sel.dataset.idx);
          itens[idx].categoria = sel.value;
          itens[idx].subtipo = "";
          renderItens();
          recalcularTotal();
        });
      });
      wrap.querySelectorAll(".itQtd").forEach(function(inp){
        inp.addEventListener("input", function(){
          var idx = Number(inp.dataset.idx);
          itens[idx].qtd = Number(inp.value) || 0;
          renderItens();
          recalcularTotal();
          preserveFocus(inp);
        });
      });
      wrap.querySelectorAll(".itSubtipo").forEach(function(sel){
        sel.addEventListener("change", function(){
          var idx = Number(sel.dataset.idx);
          if(sel.value === "__outro__"){
            itens[idx].subtipo = "";
            renderItens();
            return;
          }
          itens[idx].subtipo = sel.value;
        });
      });
      wrap.querySelectorAll(".itSubtipoOutro").forEach(function(inp){
        inp.addEventListener("input", function(){
          var idx = Number(inp.dataset.idx);
          itens[idx].subtipo = inp.value.trim();
          preserveFocus(inp);
        });
      });
      wrap.querySelectorAll(".itRemove").forEach(function(btn){
        btn.addEventListener("click", function(){
          var idx = Number(btn.dataset.idx);
          itens.splice(idx, 1);
          renderItens();
          recalcularTotal();
        });
      });
    }

    renderItens();
    recalcularTotal();

    document.getElementById("btnAddItem").addEventListener("click", function(){
      var usados = itens.map(function(it){ return it.categoria; });
      var proxima = CATEGORIAS.filter(function(c){ return usados.indexOf(c.nome) === -1; })[0] || CATEGORIAS[0];
      itens.push({ categoria: proxima.nome, subtipo: "", qtd: 1 });
      renderItens();
      recalcularTotal();
    });

    // autocomplete de cliente
    var pNome = document.getElementById("pNome");
    pNome.addEventListener("input", function(){
      var q = pNome.value.trim().toLowerCase();
      var box = document.getElementById("pAutocomplete");
      if(q.length < 2){ box.innerHTML = ""; return; }
      var matches = state.clientes.filter(function(c){ return c.nome.toLowerCase().indexOf(q) !== -1; }).slice(0, 6);
      if(matches.length === 0){ box.innerHTML = ""; return; }
      box.innerHTML = '<div class="autocomplete-list">' + matches.map(function(c){
        return '<div class="autocomplete-item" data-nome="'+escapeHtml(c.nome)+'"><div class="n">'+escapeHtml(c.nome)+'</div><div class="m">'+escapeHtml(c.municipio||"")+' · '+escapeHtml(c.telefone||"")+'</div></div>';
      }).join("") + '</div>';
      box.querySelectorAll(".autocomplete-item").forEach(function(item, idx){
        item.addEventListener("click", function(){
          var c = matches[idx];
          pNome.value = c.nome;
          document.getElementById("pTelefone").value = c.telefone || "";
          document.getElementById("pEndereco").value = c.endereco || "";
          document.getElementById("pMunicipio").value = c.municipio || "";
          box.innerHTML = "";
        });
      });
    });

    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mCancel").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", function(e){ if(e.target.id === "modalOverlay") closeModal(); });

    document.getElementById("mSave").addEventListener("click", function(){
      var nome = pNome.value.trim();
      if(!nome){ toast("Informe o nome do cliente.", "err"); return; }
      if(itens.length === 0){ toast("Adicione ao menos um tipo de ave.", "err"); return; }
      var itensValidos = itens.filter(function(it){ return (Number(it.qtd)||0) > 0; });
      if(itensValidos.length === 0){ toast("Informe uma quantidade maior que zero.", "err"); return; }

      var payload = {
        pedidoId: editing ? pedidoGroup.pedidoId : undefined,
        nome: nome,
        telefone: document.getElementById("pTelefone").value.trim(),
        endereco: document.getElementById("pEndereco").value.trim(),
        municipio: document.getElementById("pMunicipio").value.trim(),
        observacoes: document.getElementById("pObs").value.trim(),
        itens: itensValidos.map(function(it){ return { categoria: it.categoria, subtipo: it.subtipo || "", qtd: Number(it.qtd) || 0 }; })
      };

      if(!editing){
        var clienteExiste = state.clientes.some(function(cl){ return cl.nome.trim().toLowerCase() === nome.toLowerCase(); });
        if(!clienteExiste){
          confirmModal(
            "Cliente não encontrado",
            "\""+escapeHtml(nome)+"\" ainda não está cadastrado em Clientes. Deseja cadastrar esse cliente agora?",
            "Sim, cadastrar",
            function(){
              openClienteModal(
                { nome: payload.nome, telefone: payload.telefone, endereco: payload.endereco, municipio: payload.municipio },
                null,
                true
              );
            },
            false,
            null,
            true
          );
          return;
        }
      }

      salvarPedido(payload, editing);
    });
  }

  function salvarPedido(payload, editing){
    var btn = document.getElementById("mSave");
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';

    if(!editing) payload.pedidoId = payload.pedidoId || (Date.now().toString(36) + Math.random().toString(36).slice(2));

    // Atualiza a tela na hora, sem esperar a planilha responder. A
    // planilha continua sendo gravada por trás; se falhar, desfaz.
    var existente = editing ? state.pedidos.filter(function(p){ return p.pedidoId === payload.pedidoId; })[0] : null;
    var dataCriacaoTexto = existente ? existente.dataCriacao : (function(){
      var agora = new Date();
      return String(agora.getDate()).padStart(2,"0") + "/" + String(agora.getMonth()+1).padStart(2,"0") + "/" + agora.getFullYear() + " " + String(agora.getHours()).padStart(2,"0") + ":" + String(agora.getMinutes()).padStart(2,"0");
    })();
    var statusTexto = existente ? existente.status : "Ativo";
    state.pedidos = state.pedidos.filter(function(p){ return p.pedidoId !== payload.pedidoId; });
    payload.itens.forEach(function(it){
      var categoriaInfo = CATEGORIAS.filter(function(c){ return c.nome === it.categoria; })[0];
      state.pedidos.push({
        rowIndex: 0,
        categoria: it.categoria,
        subtipoLabel: categoriaInfo ? categoriaInfo.subtipoLabel : null,
        nome: payload.nome, telefone: payload.telefone, endereco: payload.endereco, municipio: payload.municipio,
        subtipo: it.subtipo || "", qtd: it.qtd, observacoes: payload.observacoes,
        status: statusTexto, dataCriacao: dataCriacaoTexto, pedidoId: payload.pedidoId
      });
    });
    renderPedidos();
    renderHistorico();
    toast(editing ? "Pedido atualizado." : "Pedido criado.");
    closeModal();

    var call = editing ? api("updatePedido", payload) : api("addPedido", payload);
    call.catch(function(err){
      toast("Não foi possível salvar: " + err.message, "err");
      loadPedidos();
    });
  }

  // ---------------------------------------------------------------
  // PLANTAS — MODAL: NOVO / EDITAR PEDIDO
  // ---------------------------------------------------------------
  function openPedidoPlantaModal(pedidoGroup){
    var editing = !!(pedidoGroup && pedidoGroup.pedidoId);

    if(state.plantas.length === 0){
      toast("Cadastre ao menos um tipo de planta antes de lançar um pedido.", "err");
      return;
    }

    var itens = pedidoGroup && pedidoGroup.itens && pedidoGroup.itens.length
      ? pedidoGroup.itens.map(function(it){ return { planta: it.planta, qtd: it.qtd }; })
      : [{ planta: "", qtd: 1 }];

    var html = '<div class="overlay" id="modalOverlay"><div class="modal modal-pedido">';
    html += '<div class="modal-head"><h2>'+(editing?"Editar pedido":"Novo pedido")+'</h2><button class="icon-btn" id="mClose" style="color:var(--ink);border-color:var(--line-strong);background:var(--surface-2);">'+ICON.close+'</button></div>';

    html += '<div class="field autocomplete">';
    html += '<label>Cliente</label>';
    html += '<input type="text" id="pNome" placeholder="Nome do cliente" value="'+escapeHtml(pedidoGroup?pedidoGroup.nome:"")+'" autocomplete="off">';
    html += '<div id="pAutocomplete"></div>';
    html += '</div>';

    html += '<div class="field-row">';
    html += '<div class="field"><label>Telefone</label><input type="tel" id="pTelefone" placeholder="(54) 99999-9999" value="'+escapeHtml(pedidoGroup?pedidoGroup.telefone:"")+'"></div>';
    html += '<div class="field"><label>Município</label><input type="text" id="pMunicipio" placeholder="Município" value="'+escapeHtml(pedidoGroup?pedidoGroup.municipio:"")+'"></div>';
    html += '</div>';

    html += '<div class="field"><label>Endereço</label><input type="text" id="pEndereco" placeholder="Endereço completo" value="'+escapeHtml(pedidoGroup?pedidoGroup.endereco:"")+'"></div>';

    html += '<label class="itens-label">Plantas neste pedido</label>';
    html += '<div id="pItensWrapPlanta"></div>';
    html += '<button type="button" class="btn btn-sm" id="btnAddItemPlanta" style="margin-bottom:16px;">'+ICON.plus+' Adicionar outra planta</button>';

    html += '<div class="field"><label>Observações</label><input type="text" id="pObs" placeholder="Opcional" value="'+escapeHtml(pedidoGroup?pedidoGroup.observacoes:"")+'"></div>';

    html += '<div class="pedido-total-row"><span>Total do pedido</span><span id="pTotalValorPlanta" class="pedido-total-valor">R$ 0,00</span></div>';

    html += '<div class="modal-actions">';
    html += '<button class="btn" id="mCancel">Cancelar</button>';
    html += '<button class="btn btn-primary" id="mSave">'+(editing?"Salvar alterações":"Criar pedido")+'</button>';
    html += '</div></div></div>';

    document.getElementById("modalRoot").innerHTML = html;

    function recalcularTotal(){
      var total = itens.reduce(function(s, it){ return s + (Number(it.qtd)||0) * precoDePlanta(it.planta); }, 0);
      document.getElementById("pTotalValorPlanta").textContent = formatMoeda(total);
    }

    function renderItens(){
      var wrap = document.getElementById("pItensWrapPlanta");
      var html2 = itens.map(function(it, idx){
        var preco = precoDePlanta(it.planta);
        var linha = '<div class="item-linha" data-idx="'+idx+'">';
        linha += '<div class="item-linha-top">';
        linha += '<div class="planta-combo">';
        linha += '<input type="text" class="itPlantaInput" data-idx="'+idx+'" autocomplete="off" placeholder="Digite pra buscar a planta..." value="'+escapeHtml(it.planta||"")+'">';
        linha += '<div class="planta-combo-list" id="plantaComboList_'+idx+'"></div>';
        linha += '</div>';
        linha += '<input type="text" inputmode="numeric" class="itQtd" id="itQtd_'+idx+'" data-idx="'+idx+'" value="'+(it.qtd===0||it.qtd===undefined||it.qtd===null?"":it.qtd)+'" placeholder="Qtd">';
        if(itens.length > 1){
          linha += '<button type="button" class="btn btn-icon btn-sm btn-danger-ghost itRemove" data-idx="'+idx+'" title="Remover esta planta">'+ICON.trash+'</button>';
        }
        linha += '</div>';
        linha += '<div class="item-linha-valor">'+it.qtd+' x '+formatMoeda(preco)+' = <b>'+formatMoeda((Number(it.qtd)||0)*preco)+'</b></div>';
        linha += '</div>';
        return linha;
      }).join("");
      wrap.innerHTML = html2;

      wrap.querySelectorAll(".itPlantaInput").forEach(function(inp){
        var idx = Number(inp.dataset.idx);
        var listEl = document.getElementById("plantaComboList_" + idx);

        function mostrarSugestoes(){
          var q = inp.value.trim().toLowerCase();
          var matches = state.plantas.filter(function(p){ return !q || p.nome.toLowerCase().indexOf(q) !== -1; }).slice(0, 30);
          if(matches.length === 0){
            listEl.innerHTML = '<div class="planta-combo-empty">Nenhuma planta encontrada</div>';
            return;
          }
          listEl.innerHTML = matches.map(function(p){
            var catTag = p.categoria ? '<span class="tag '+categoriaTagClasse(p.categoria)+'">'+escapeHtml(p.categoria)+'</span>' : '';
            return '<div class="planta-combo-item" data-nome="'+escapeHtml(p.nome)+'"><span>'+escapeHtml(p.nome)+'</span>'+catTag+'</div>';
          }).join("");
          listEl.querySelectorAll(".planta-combo-item").forEach(function(item){
            item.addEventListener("mousedown", function(e){
              e.preventDefault();
              itens[idx].planta = item.dataset.nome;
              renderItens();
              recalcularTotal();
            });
          });
        }

        inp.addEventListener("focus", mostrarSugestoes);
        inp.addEventListener("input", mostrarSugestoes);
        inp.addEventListener("blur", function(){
          setTimeout(function(){
            listEl.innerHTML = "";
            inp.value = itens[idx].planta || "";
          }, 150);
        });
      });
      wrap.querySelectorAll(".itQtd").forEach(function(inp){
        inp.addEventListener("input", function(){
          var idx = Number(inp.dataset.idx);
          itens[idx].qtd = Number(inp.value) || 0;
          renderItens();
          recalcularTotal();
          preserveFocus(inp);
        });
      });
      wrap.querySelectorAll(".itRemove").forEach(function(btn){
        btn.addEventListener("click", function(){
          var idx = Number(btn.dataset.idx);
          itens.splice(idx, 1);
          renderItens();
          recalcularTotal();
        });
      });
    }

    renderItens();
    recalcularTotal();

    document.getElementById("btnAddItemPlanta").addEventListener("click", function(){
      var usadas = itens.map(function(it){ return it.planta; });
      var proxima = state.plantas.filter(function(p){ return usadas.indexOf(p.nome) === -1; })[0] || state.plantas[0];
      itens.push({ planta: proxima.nome, qtd: 1 });
      renderItens();
      recalcularTotal();
    });

    // autocomplete de cliente
    var pNome = document.getElementById("pNome");
    pNome.addEventListener("input", function(){
      var q = pNome.value.trim().toLowerCase();
      var box = document.getElementById("pAutocomplete");
      if(q.length < 2){ box.innerHTML = ""; return; }
      var matches = state.clientes.filter(function(c){ return c.nome.toLowerCase().indexOf(q) !== -1; }).slice(0, 6);
      if(matches.length === 0){ box.innerHTML = ""; return; }
      box.innerHTML = '<div class="autocomplete-list">' + matches.map(function(c){
        return '<div class="autocomplete-item" data-nome="'+escapeHtml(c.nome)+'"><div class="n">'+escapeHtml(c.nome)+'</div><div class="m">'+escapeHtml(c.municipio||"")+' · '+escapeHtml(c.telefone||"")+'</div></div>';
      }).join("") + '</div>';
      box.querySelectorAll(".autocomplete-item").forEach(function(item, idx){
        item.addEventListener("click", function(){
          var c = matches[idx];
          pNome.value = c.nome;
          document.getElementById("pTelefone").value = c.telefone || "";
          document.getElementById("pEndereco").value = c.endereco || "";
          document.getElementById("pMunicipio").value = c.municipio || "";
          box.innerHTML = "";
        });
      });
    });

    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mCancel").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", function(e){ if(e.target.id === "modalOverlay") closeModal(); });

    document.getElementById("mSave").addEventListener("click", function(){
      var nome = pNome.value.trim();
      if(!nome){ toast("Informe o nome do cliente.", "err"); return; }
      if(itens.length === 0){ toast("Adicione ao menos uma planta.", "err"); return; }
      var semPlanta = itens.some(function(it){ return !it.planta; });
      if(semPlanta){ toast("Escolha uma planta da lista pra cada item (clique numa sugestão).", "err"); return; }
      var itensValidos = itens.filter(function(it){ return (Number(it.qtd)||0) > 0; });
      if(itensValidos.length === 0){ toast("Informe uma quantidade maior que zero.", "err"); return; }

      var payload = {
        pedidoId: editing ? pedidoGroup.pedidoId : undefined,
        nome: nome,
        telefone: document.getElementById("pTelefone").value.trim(),
        endereco: document.getElementById("pEndereco").value.trim(),
        municipio: document.getElementById("pMunicipio").value.trim(),
        observacoes: document.getElementById("pObs").value.trim(),
        itens: itensValidos.map(function(it){ return { planta: it.planta, qtd: Number(it.qtd) || 0 }; })
      };

      if(!editing){
        var clienteExiste = state.clientes.some(function(cl){ return cl.nome.trim().toLowerCase() === nome.toLowerCase(); });
        if(!clienteExiste){
          confirmModal(
            "Cliente não encontrado",
            "\""+escapeHtml(nome)+"\" ainda não está cadastrado em Clientes. Deseja cadastrar esse cliente agora?",
            "Sim, cadastrar",
            function(){
              openClienteModal(
                { nome: payload.nome, telefone: payload.telefone, endereco: payload.endereco, municipio: payload.municipio },
                null,
                true
              );
            },
            false,
            null,
            true
          );
          return;
        }
      }

      salvarPedidoPlanta(payload, editing);
    });
  }

  function salvarPedidoPlanta(payload, editing){
    var btn = document.getElementById("mSave");
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';

    var call = editing ? api("updatePedidoPlanta", payload) : api("addPedidoPlanta", payload);
    call.then(function(){
      toast(editing ? "Pedido atualizado." : "Pedido criado.");
      closeModal();
      loadPedidosPlantas();
    }).catch(function(err){
      toast(err.message, "err");
      btn.disabled = false; btn.textContent = editing ? "Salvar alterações" : "Criar pedido";
    });
  }

  // ---------------------------------------------------------------
  // VIEW: CLIENTES
  // ---------------------------------------------------------------
  function filteredClientes(){
    return state.clientes.filter(function(c){
      if(state.buscaClientes){
        var q = state.buscaClientes.toLowerCase();
        var hay = (c.nome + " " + c.municipio + " " + c.telefone).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function(a,b){ return (a.nome||"").localeCompare(b.nome||""); });
  }

  function renderClientes(){
    var root = document.getElementById("viewClientes");
    var html = '';
    html += '<div class="toolbar">';
    html += '<div class="search-box">'+ICON.search+'<input type="text" id="cBusca" placeholder="Buscar cliente" value="'+escapeHtml(state.buscaClientes)+'"></div>';
    html += '<div class="spacer"></div>';
    html += '<button class="btn btn-primary" id="btnNovoCliente">'+ICON.plus+' Novo cliente</button>';
    html += '</div>';

    html += '<div class="card">';
    if(state.loadingClientes){
      html += '<div class="loading-row"><div class="spinner spinner-dark"></div>Carregando clientes...</div>';
    } else {
      var list = filteredClientes();
      if(list.length === 0){
        html += emptyState(ICON.users, "Nenhum cliente encontrado", state.clientes.length===0 ? "Cadastre o primeiro cliente para começar." : "Ajuste a busca ou cadastre um novo cliente.");
      } else {
        html += '<table><thead><tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th>Município</th><th></th></tr></thead><tbody>';
        list.forEach(function(c){
          html += '<tr>';
          html += '<td data-label="Nome">'+escapeHtml(c.nome)+'</td>';
          html += '<td data-label="Telefone">'+escapeHtml(c.telefone||"")+'</td>';
          html += '<td data-label="Endereço" class="cell-sub">'+escapeHtml(c.endereco||"")+'</td>';
          html += '<td data-label="Município">'+escapeHtml(c.municipio||"")+'</td>';
          html += '<td><div class="row-actions">';
          html += '<button class="btn btn-icon btn-sm" data-act="edit-cliente" data-row="'+c.rowIndex+'" title="Editar">'+ICON.edit+'</button>';
          html += '<button class="btn btn-icon btn-sm btn-danger-ghost" data-act="del-cliente" data-row="'+c.rowIndex+'" title="Remover">'+ICON.trash+'</button>';
          html += '</div></td>';
          html += '</tr>';
        });
        html += '</tbody></table>';
      }
    }
    html += '</div>';
    root.innerHTML = html;

    document.getElementById("countClientes").textContent = state.clientes.length;

    document.getElementById("btnNovoCliente").addEventListener("click", function(){ openClienteModal(null); });
    var cBusca = document.getElementById("cBusca");
    cBusca.addEventListener("input", function(e){ state.buscaClientes = e.target.value; renderClientes(); preserveFocus(cBusca); });

    root.querySelectorAll('[data-act="edit-cliente"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var c = state.clientes.filter(function(x){ return String(x.rowIndex) === btn.dataset.row; })[0];
        if(c) openClienteModal(c);
      });
    });
    root.querySelectorAll('[data-act="del-cliente"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var c = state.clientes.filter(function(x){ return String(x.rowIndex) === btn.dataset.row; })[0];
        confirmModal("Remover cliente", "Remover " + (c?c.nome:"") + " do cadastro? Pedidos já lançados não são afetados.", "Remover", function(){
          api("deleteCliente", { rowIndex: c.rowIndex }).then(function(){
            toast("Cliente removido.");
            loadClientes();
          }).catch(function(err){ toast(err.message, "err"); });
        }, true);
      });
    });
  }

  function openClienteModal(cliente, onSaved, nested){
    var editing = !!(cliente && cliente.rowIndex);
    var targetRoot = nested ? "modalRoot2" : "modalRoot";
    var doClose = nested ? closeModal2 : closeModal;
    var overlayClass = nested ? "overlay overlay-nested" : "overlay";
    var html = '<div class="'+overlayClass+'" id="modalOverlayCliente'+(nested?"2":"")+'"><div class="modal">';
    html += '<div class="modal-head"><h2>'+(editing?"Editar cliente":"Novo cliente")+'</h2><button class="icon-btn" id="mCloseC" style="color:var(--ink);border-color:var(--line-strong);background:var(--surface-2);">'+ICON.close+'</button></div>';
    html += '<div class="field"><label>Nome</label><input type="text" id="cNome" placeholder="Nome completo" value="'+escapeHtml(cliente?cliente.nome:"")+'"></div>';
    html += '<div class="field"><label>Telefone</label><input type="tel" id="cTelefone" placeholder="(54) 99999-9999" value="'+escapeHtml(cliente?cliente.telefone:"")+'"></div>';
    html += '<div class="field"><label>Endereço</label><input type="text" id="cEndereco" placeholder="Endereço completo" value="'+escapeHtml(cliente?cliente.endereco:"")+'"></div>';
    html += '<div class="field"><label>Município</label><input type="text" id="cMunicipio" placeholder="Município" value="'+escapeHtml(cliente?cliente.municipio:"")+'"></div>';
    html += '<p id="clienteErro" style="display:none;background:var(--red-soft);color:var(--red);border-radius:var(--radius);padding:11px 14px;font-size:13.5px;font-weight:600;margin:0 0 14px;"></p>';
    html += '<div class="modal-actions"><button class="btn" id="mCancelC">Cancelar</button><button class="btn btn-primary" id="mSaveC">'+(editing?"Salvar alterações":"Adicionar cliente")+'</button></div>';
    html += '</div></div>';
    document.getElementById(targetRoot).innerHTML = html;

    var overlayEl = document.getElementById("modalOverlayCliente"+(nested?"2":""));
    document.getElementById("mCloseC").addEventListener("click", doClose);
    document.getElementById("mCancelC").addEventListener("click", doClose);
    overlayEl.addEventListener("click", function(e){ if(e.target === overlayEl) doClose(); });

    ["cNome","cTelefone","cEndereco","cMunicipio"].forEach(function(id){
      document.getElementById(id).addEventListener("input", function(){
        if(this.value.trim()) this.style.borderColor = "";
        var algumVazio = ["cNome","cTelefone","cEndereco","cMunicipio"].some(function(cid){ return !document.getElementById(cid).value.trim(); });
        if(!algumVazio) document.getElementById("clienteErro").style.display = "none";
      });
    });

    document.getElementById("mSaveC").addEventListener("click", function(){
      var campos = [
        { id: "cNome", label: "Nome" },
        { id: "cTelefone", label: "Telefone" },
        { id: "cEndereco", label: "Endereço" },
        { id: "cMunicipio", label: "Município" }
      ];
      var faltando = [];
      campos.forEach(function(c){
        var el = document.getElementById(c.id);
        var vazio = !el.value.trim();
        el.style.borderColor = vazio ? "var(--red)" : "";
        if(vazio) faltando.push(c.label);
      });
      var erroEl = document.getElementById("clienteErro");
      if(faltando.length > 0){
        erroEl.textContent = "Impossível finalizar o cadastro. Falta preencher: " + faltando.join(", ") + ".";
        erroEl.style.display = "block";
        return;
      }
      erroEl.style.display = "none";

      var nome = document.getElementById("cNome").value.trim();
      var payload = {
        rowIndex: editing ? cliente.rowIndex : undefined,
        nome: nome,
        telefone: document.getElementById("cTelefone").value.trim(),
        endereco: document.getElementById("cEndereco").value.trim(),
        municipio: document.getElementById("cMunicipio").value.trim()
      };
      var btn = document.getElementById("mSaveC");
      btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
      var call = editing ? api("updateCliente", payload) : api("addCliente", payload);
      call.then(function(resultData){
        toast(editing ? "Cliente atualizado." : "Cliente adicionado.");
        doClose();
        if(editing){
          var idx = state.clientes.findIndex(function(c){ return c.rowIndex === cliente.rowIndex; });
          var atualizado = { rowIndex: cliente.rowIndex, nome: payload.nome, telefone: payload.telefone, endereco: payload.endereco, municipio: payload.municipio };
          if(idx > -1){ state.clientes[idx] = atualizado; } else { state.clientes.push(atualizado); }
        } else {
          state.clientes.push({
            rowIndex: resultData && resultData.rowIndex,
            nome: payload.nome,
            telefone: payload.telefone,
            endereco: payload.endereco,
            municipio: payload.municipio
          });
        }
        renderClientes();
        loadClientes();
        if(onSaved) onSaved();
      }).catch(function(err){
        toast(err.message, "err");
        btn.disabled = false; btn.textContent = editing ? "Salvar alterações" : "Adicionar cliente";
      });
    });
  }

  // ---------------------------------------------------------------
  // MODAL: CONFIRMAÇÃO
  // ---------------------------------------------------------------
  function confirmModal(title, body, confirmLabel, onConfirm, danger, onCancel, nested){
    var targetRoot = nested ? "modalRoot2" : "modalRoot";
    var doClose = nested ? closeModal2 : closeModal;
    var overlayClass = nested ? "overlay overlay-nested" : "overlay";
    var overlayId = "modalOverlayConfirm" + (nested ? "2" : "");
    var html = '<div class="'+overlayClass+'" id="'+overlayId+'"><div class="modal modal-sm">';
    html += '<div class="modal-head"><h2>'+title+'</h2></div>';
    html += '<p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0;">'+body+'</p>';
    html += '<div class="modal-actions"><button class="btn" id="mCancelX">'+(onCancel?"Não":"Cancelar")+'</button><button class="btn '+(danger?'btn-danger-ghost':'btn-primary')+'" id="mConfirmX">'+confirmLabel+'</button></div>';
    html += '</div></div>';
    document.getElementById(targetRoot).innerHTML = html;
    var overlayEl = document.getElementById(overlayId);
    document.getElementById("mCancelX").addEventListener("click", function(){
      doClose();
      if(onCancel) onCancel();
    });
    overlayEl.addEventListener("click", function(e){ if(e.target === overlayEl){ doClose(); if(onCancel) onCancel(); } });
    document.getElementById("mConfirmX").addEventListener("click", function(){
      doClose();
      onConfirm();
    });
  }

  function closeModal(){
    document.getElementById("modalRoot").innerHTML = "";
  }

  function closeModal2(){
    document.getElementById("modalRoot2").innerHTML = "";
  }

  // ---------------------------------------------------------------
  // MODAL: AJUDA
  // ---------------------------------------------------------------
  function helpSection(icon, title, bodyHtml){
    return '<div class="help-section">'
      + '<div class="help-section-head"><div class="help-section-icon">'+icon+'</div><h3>'+title+'</h3></div>'
      + bodyHtml
      + '</div>';
  }

  // ---------------------------------------------------------------
  // MODAL: ORDEM (passo a passo do ciclo de vendas de aves)
  // ---------------------------------------------------------------
  function ordemPasso(numero, titulo, texto, destaque){
    var html = '<div style="display:flex;gap:14px;padding:14px 0;'+(numero<7?'border-bottom:1px solid var(--line);':'')+'">';
    html += '<div style="flex-shrink:0;width:30px;height:30px;border-radius:50%;background:'+(destaque?'var(--red)':'var(--green-dark)')+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">'+numero+'</div>';
    html += '<div style="flex:1;">';
    html += '<div style="font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:3px;">'+titulo+(destaque?' <span style="color:var(--red);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;">· Essencial</span>':'')+'</div>';
    html += '<div style="font-size:13.5px;color:var(--ink-soft);line-height:1.55;">'+texto+'</div>';
    html += '</div></div>';
    return html;
  }

  function openOrdemModal(){
    var html = '<div class="overlay" id="modalOverlay"><div class="modal modal-help">';
    html += '<div class="modal-head"><h2>Ordem correta pra fazer um lote de vendas</h2><button class="icon-btn" id="mClose" style="color:var(--ink);border-color:var(--line-strong);background:var(--surface-2);">'+ICON.close+'</button></div>';
    html += '<p class="help" style="margin:0 0 6px;">Siga essa ordem pra nenhuma etapa importante ficar pra trás — os passos marcados em vermelho são os que mais causam problema se forem pulados.</p>';

  function openSettingsModal(){
    var html = '<div class="overlay" id="modalOverlay"><div class="modal">';
    html += '<div class="modal-head"><h2>Conexão com a planilha</h2><button class="icon-btn" id="mClose" style="color:var(--ink);border-color:var(--line-strong);background:var(--surface-2);">'+ICON.close+'</button></div>';
    html += '<div class="field"><label>URL do app da Web (Apps Script)</label>';
    html += '<input type="text" id="sUrl" placeholder="https://script.google.com/macros/s/.../exec" value="'+escapeHtml(state.apiUrl)+'"></div>';
    html += '<p class="help">Essa URL vem do Google Sheets: Extensões → Apps Script → Implantar → App da Web. Cole aqui o link que termina em <code>/exec</code>. Fica salvo só neste navegador.</p>';
    html += '<div class="modal-actions"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Salvar e conectar</button></div>';
    html += '</div></div>';
    document.getElementById("modalRoot").innerHTML = html;

    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mCancel").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", function(e){ if(e.target.id === "modalOverlay") closeModal(); });
    document.getElementById("mSave").addEventListener("click", function(){
      var url = document.getElementById("sUrl").value.trim();
      if(!url){ toast("Cole a URL do app da Web.", "err"); return; }
      state.apiUrl = url;
      safeSet(STORAGE_KEY, url);
      closeModal();
      if(senhaAtual){
        testConnection();
        loadAll();
      } else {
        mostrarTelaSenha();
      }
    });
  }

      document.getElementById("secaoAves").style.display = state.viewGeral === "aves" ? "" : "none";
      document.getElementById("secaoPlantas").style.display = state.viewGeral === "plantas" ? "" : "none";
      document.getElementById("secaoMaquinas").style.display = state.viewGeral === "maquinas" ? "" : "none";
      document.getElementById("viewClientes").style.display = state.viewGeral === "clientes" ? "" : "none";
      document.getElementById("btnOrdem").style.display = state.viewGeral === "aves" ? "" : "none";
    });
  });

  // Sub-abas dentro de Aves: Pedidos / Histórico / Encomendas / GTA
  document.querySelectorAll(".tab-aves").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".tab-aves").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      state.view = tab.dataset.view;
      document.getElementById("viewPedidos").style.display = state.view === "pedidos" ? "" : "none";
      document.getElementById("viewHistorico").style.display = state.view === "historico" ? "" : "none";
      document.getElementById("viewEncomendas").style.display = state.view === "encomendas" ? "" : "none";
      document.getElementById("viewGta").style.display = state.view === "gta" ? "" : "none";
      if(state.view === "encomendas") renderEncomendas();
      if(state.view === "gta") renderGta();
    });
  });

  // Sub-abas dentro de Plantas: Pedidos / Histórico / Cadastro
  document.querySelectorAll(".tab-planta").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".tab-planta").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      state.viewPlanta = tab.dataset.viewplanta;
      document.getElementById("viewPlantasPedidos").style.display = state.viewPlanta === "pedidos" ? "" : "none";
      document.getElementById("viewPlantasHistorico").style.display = state.viewPlanta === "historico" ? "" : "none";
      document.getElementById("viewPlantasCadastro").style.display = state.viewPlanta === "cadastro" ? "" : "none";
    });
  });

  // Sub-abas dentro de Máquinas: Aluguéis / Histórico / Cadastro
  document.querySelectorAll(".tab-maquina").forEach(function(tab){
    tab.addEventListener("click", function(){
      document.querySelectorAll(".tab-maquina").forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      state.viewMaquina = tab.dataset.viewmaquina;
      document.getElementById("viewAlugueis").style.display = state.viewMaquina === "alugueis" ? "" : "none";
      document.getElementById("viewHistoricoMaquinas").style.display = state.viewMaquina === "historico" ? "" : "none";
      document.getElementById("viewCadastroMaquinas").style.display = state.viewMaquina === "cadastro" ? "" : "none";
    });
  });

  // ---------------------------------------------------------------
  // AUTO-ATUALIZAÇÃO (checa de tempos em tempos, mesmo com o app já aberto)
  // ---------------------------------------------------------------
  var UPDATE_CHECK_INTERVAL_MS = 10 * 60 * 1000; // 10 minutos
  var avisoVersaoJaMostrado = null;

  // Converte "2", "2.2", "2.10" etc num número comparável (evita o bug de
  // parseInt cortar tudo depois do ponto).
  function parseVersaoTexto(txt){
    var partes = String(txt||"0").trim().split(".");
    var maior = parseInt(partes[0], 10) || 0;
    var menor = partes.length > 1 ? (parseInt(partes[1], 10) || 0) : 0;
    return maior * 1000 + menor;
  }

  function carregarConfigUpdate(){
    return fetch("config.txt?t=" + Date.now())
      .then(function(r){ return r.ok ? r.text() : ""; })
      .then(function(txt){
        var cfg = {};
        txt.split(/\r?\n/).forEach(function(linha){
          var idx = linha.indexOf("=");
          if(idx > -1){ cfg[linha.slice(0, idx).trim()] = linha.slice(idx + 1).trim(); }
        });
        return cfg;
      }).catch(function(){ return {}; });
  }

  function checarAtualizacaoPeriodica(manual){
    carregarConfigUpdate().then(function(cfg){
      if(!cfg.GITHUB_USER || !cfg.GITHUB_REPO || cfg.GITHUB_USER.indexOf("SEU-USUARIO") === 0){
        if(manual) toast("config.txt não está configurado ainda.", "err");
        return;
      }
      var baseUrl = "https://raw.githubusercontent.com/" + cfg.GITHUB_USER + "/" + cfg.GITHUB_REPO + "/main/";
      Promise.all([
        fetch("version.txt?t=" + Date.now()).then(function(r){ return r.text(); }).catch(function(){ return "0"; }),
        fetch(baseUrl + "version.txt?t=" + Date.now()).then(function(r){ return r.text(); }).catch(function(){ return "0"; })
      ]).then(function(res){
        var local = parseVersaoTexto(res[0]);
        var remoto = parseVersaoTexto(res[1]);
        if(remoto > local && (manual || avisoVersaoJaMostrado !== remoto)){
          avisoVersaoJaMostrado = remoto;
          fetch(baseUrl + "changelog.txt?t=" + Date.now()).then(function(r){ return r.ok ? r.text() : ""; }).catch(function(){ return ""; }).then(function(changelog){
            mostrarAvisoAtualizacao(baseUrl, changelog);
          });
        } else if(manual){
          toast("Você já está na versão mais recente.");
        }
      }).catch(function(){
        if(manual) toast("Não foi possível checar agora. Confira sua conexão.", "err");
      });
    });
  }

  function mostrarAvisoAtualizacao(baseUrl, changelog){
    var corpo = "Uma nova versão do Aves Agro está disponível.";
    if(changelog && changelog.trim()){
      corpo += "<br><br><b>Novidades:</b><br>" + escapeHtml(changelog.trim()).replace(/\n/g, "<br>");
    }
    corpo += "<br><br>Deseja atualizar agora? A tela vai recarregar sozinha em seguida.";
    confirmModal("Nova versão disponível", corpo, "Atualizar agora", function(){
      toast("Baixando atualização...");
      fetch("__atualizar__", { method: "POST" }).then(function(r){ return r.json(); }).then(function(data){
        if(data && data.ok){
          toast("Atualizado! Recarregando...");
          setTimeout(function(){ location.reload(); }, 1200);
        } else {
          toast("Falha ao atualizar: " + (data && data.error ? data.error : "erro desconhecido"), "err");
        }
      }).catch(function(){
        toast("Não foi possível baixar a atualização agora.", "err");
      });
    }, false, null);
  }

  // ---------------------------------------------------------------
  // TELA DE SENHA (verificada de verdade pela planilha — nenhuma senha
  // fica escrita neste arquivo)
  // ---------------------------------------------------------------
  document.getElementById("btnHelp").addEventListener("click", openHelpModal);
  document.getElementById("btnOrdem").addEventListener("click", openOrdemModal);
  document.getElementById("btnOrdem").style.display = state.viewGeral === "aves" ? "" : "none";
  document.getElementById("btnSettings").addEventListener("click", openSettingsModal);
  document.getElementById("btnRefresh").addEventListener("click", function(){ loadAll(); });
  document.getElementById("btnForcarUpdate").addEventListener("click", function(){ checarAtualizacaoPeriodica(true); });

  var senhaAtual = null;

  function iniciarAppLiberado(){
    if(state.apiUrl){
      loadAll();
    } else {
      openSettingsModal();
    }
    setTimeout(checarAtualizacaoPeriodica, 5000);
    setInterval(checarAtualizacaoPeriodica, UPDATE_CHECK_INTERVAL_MS);
  }

  function mostrarTelaSenha(){
    var html = '<div class="overlay" id="lockOverlay" style="z-index:300;background:rgba(24,32,20,0.9);">';
    html += '<div class="modal modal-sm">';
    html += '<div class="modal-head"><h2>Acesso restrito</h2></div>';
    html += '<p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;">Digite a senha para abrir o Aves Agro.</p>';
    html += '<div class="field"><label>Senha</label><input type="text" id="senhaInput" placeholder="Senha" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc;"></div>';
    html += '<p id="senhaErro" style="display:none;color:var(--red);font-size:13px;margin:-6px 0 12px;"></p>';
    html += '<button class="btn btn-primary" id="btnEntrarSenha" style="width:100%;justify-content:center;">Entrar</button>';
    html += '</div></div>';
    document.getElementById("modalRoot").innerHTML = html;

    var input = document.getElementById("senhaInput");
    var erro = document.getElementById("senhaErro");
    var btn = document.getElementById("btnEntrarSenha");
    input.focus();

    function tentar(){
      var tentativa = input.value;
      if(!tentativa) return;
      if(!state.apiUrl){
        // Ainda não há planilha configurada nesta máquina; não tem como
        // validar a senha ainda. Deixa passar pra tela de configuração.
        closeModal();
        iniciarAppLiberado();
        return;
      }
      erro.style.display = "none";
      btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
      senhaAtual = tentativa;
      api("getInicialCore").then(function(data){
        try { sessionStorage.setItem("aves_senha", tentativa); } catch(e){}
        closeModal();
        state.loadingPlantas = true;
        state.loadingPedidosPlantas = true;
        state.loadingMaquinas = true;
        state.loadingAlugueis = true;
        aplicarDadosCore(data);
        loadResto();
        setTimeout(checarAtualizacaoPeriodica, 5000);
        setInterval(checarAtualizacaoPeriodica, UPDATE_CHECK_INTERVAL_MS);
      }).catch(function(err){
        senhaAtual = null;
        erro.textContent = (err.message && err.message.indexOf("Senha") > -1) ? "Senha incorreta. Tente de novo." : "Não foi possível verificar agora — confira sua conexão.";
        erro.style.display = "block";
        input.value = "";
        input.focus();
        btn.disabled = false; btn.textContent = "Entrar";
      });
    }

    btn.addEventListener("click", tentar);
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") tentar(); });
  }

  var senhaSalva = null;
  try { senhaSalva = sessionStorage.getItem("aves_senha"); } catch(e){}

  fetch("version.txt?t=" + Date.now()).then(function(r){ return r.ok ? r.text() : ""; }).then(function(v){
    v = (v || "").trim();
    if(!v) return;
    var partes = v.split(".");
    var maior = partes[0] || "0";
    var menor = partes.length > 1 ? partes[1] : "0";
    document.getElementById("versaoAtual").textContent = "v" + maior + "." + menor;
  }).catch(function(){});

  renderPedidos();
  renderClientes();
  renderHistorico();
  renderPlantasPedidos();
  renderPlantasHistorico();
  renderCadastroPlantas();

  if(!state.apiUrl){
    iniciarAppLiberado();
  } else if(senhaSalva){
    senhaAtual = senhaSalva;
    iniciarAppLiberado();
  } else {
    mostrarTelaSenha();
  }

  // Avisa o servidor local pra se desligar sozinho quando a janela do
  // app for fechada -- sem isso, o servidor continuaria rodando
  // escondido, e reabrir o app pelo atalho pareceria nao fazer nada.
  window.addEventListener("unload", function(){
    try { navigator.sendBeacon("__fechar__"); } catch(e){}
  });

})();
</script>
<div id="areaImpressao"></div>

</body>
</html>
