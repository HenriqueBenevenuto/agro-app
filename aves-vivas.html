  // ---------------------------------------------------------------
  // VENDA AVULSA — venda extra, feita na hora, sem pedido prévio.
  // Já entra direto como Encerrada, marcada com o lote atual, e
  // desconta do Estoque.
  // ---------------------------------------------------------------
  function abrirVendaAvulsaModal(){
    var disponiveis = CATEGORIAS.map(function(c){
      var sobrando = (Number(state.estoque[c.nome])||0) - qtdPedidaAtiva(c.nome);
      return { nome: c.nome, sobrando: sobrando };
    }).filter(function(c){ return c.sobrando > 0; });

    if(disponiveis.length === 0){
      toast("Nenhuma ave sobrando em estoque pra vender agora.", "err");
      return;
    }

    var html = '<div class="overlay" id="modalOverlay"><div class="modal">';
    html += '<div class="modal-head"><h2>Venda avulsa</h2><button class="icon-btn" id="mClose" style="color:var(--ink);border-color:var(--line-strong);background:var(--surface-2);">'+ICON.close+'</button></div>';
    html += '<p class="help" style="margin:0 0 14px;">Pra vender aves extras na hora, sem precisar criar um pedido — já entra concluída e desconta do estoque.</p>';

    html += '<div class="field autocomplete">';
    html += '<label>Cliente</label>';
    html += '<input type="text" id="vaCliente" placeholder="Nome do cliente" autocomplete="off">';
    html += '<div id="vaAutocomplete"></div>';
    html += '</div>';
    html += '<div class="field-row">';
    html += '<div class="field"><label>Telefone</label><input type="tel" id="vaTelefone" placeholder="(54) 99999-9999"></div>';
    html += '<div class="field"><label>Município</label><input type="text" id="vaMunicipio" placeholder="Município"></div>';
    html += '</div>';
    html += '<div class="field"><label>Endereço</label><input type="text" id="vaEndereco" placeholder="Endereço completo"></div>';

    html += '<label class="itens-label">Aves disponíveis pra vender (com sobra em estoque)</label>';
    html += '<div class="gerenciar-tipos-lista">';
    disponiveis.forEach(function(c){
      html += '<div class="gerenciar-tipo-linha">';
      html += '<div>'+escapeHtml(c.nome)+' <span class="cell-sub">(sobram '+c.sobrando+')</span></div>';
      html += '<input type="text" inputmode="numeric" class="vaQtdInput" data-cat="'+encodeURIComponent(c.nome)+'" data-sobrando="'+c.sobrando+'" placeholder="Qtd" style="width:70px;">';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="pedido-total-row"><span>Total da venda</span><span id="vaTotalValor" class="pedido-total-valor">R$ 0,00</span></div>';
    html += '<div class="modal-actions"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">'+ICON.check+' Registrar venda</button></div>';
    html += '</div></div>';
    document.getElementById("modalRoot").innerHTML = html;

    function recalcularTotalAvulso(){
      var total = 0;
      document.querySelectorAll(".vaQtdInput").forEach(function(inp){
        var qtd = Number(inp.value) || 0;
        var cat = decodeURIComponent(inp.dataset.cat);
        total += qtd * precoDe(cat);
      });
      document.getElementById("vaTotalValor").textContent = formatMoeda(total);
    }

    document.querySelectorAll(".vaQtdInput").forEach(function(inp){
      inp.addEventListener("input", recalcularTotalAvulso);
    });

    var vaCliente = document.getElementById("vaCliente");
    vaCliente.addEventListener("input", function(){
      var q = vaCliente.value.trim().toLowerCase();
      var box = document.getElementById("vaAutocomplete");
      if(q.length < 2){ box.innerHTML = ""; return; }
      var matches = state.clientes.filter(function(c){ return c.nome.toLowerCase().indexOf(q) !== -1; }).slice(0, 6);
      if(matches.length === 0){ box.innerHTML = ""; return; }
      box.innerHTML = '<div class="autocomplete-list">' + matches.map(function(c){
        return '<div class="autocomplete-item" data-nome="'+escapeHtml(c.nome)+'"><div class="n">'+escapeHtml(c.nome)+'</div><div class="m">'+escapeHtml(c.municipio||"")+' · '+escapeHtml(c.telefone||"")+'</div></div>';
      }).join("") + '</div>';
      box.querySelectorAll(".autocomplete-item").forEach(function(item, idx){
        item.addEventListener("click", function(){
          var c = matches[idx];
          vaCliente.value = c.nome;
          document.getElementById("vaTelefone").value = c.telefone || "";
          document.getElementById("vaEndereco").value = c.endereco || "";
          document.getElementById("vaMunicipio").value = c.municipio || "";
          box.innerHTML = "";
        });
      });
    });

    document.getElementById("mClose").addEventListener("click", closeModal);
    document.getElementById("mCancel").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", function(e){ if(e.target.id === "modalOverlay") closeModal(); });

    document.getElementById("mSave").addEventListener("click", function(){
      var cliente = vaCliente.value.trim();
      if(!cliente){ toast("Informe o nome do cliente.", "err"); return; }

      var itensValidos = [];
      var estourou = null;
      document.querySelectorAll(".vaQtdInput").forEach(function(inp){
        var qtd = Number(inp.value) || 0;
        if(qtd > 0){
          var cat = decodeURIComponent(inp.dataset.cat);
          var sobrando = Number(inp.dataset.sobrando) || 0;
          if(qtd > sobrando) estourou = cat;
          itensValidos.push({ categoria: cat, subtipo: "", qtd: qtd });
        }
      });
      if(itensValidos.length === 0){ toast("Informe uma quantidade em pelo menos um tipo de ave.", "err"); return; }
      if(estourou){ toast('A quantidade de "'+estourou+'" é maior do que o que está sobrando.', "err"); return; }

      var payload = {
        nome: cliente,
        telefone: document.getElementById("vaTelefone").value.trim(),
        endereco: document.getElementById("vaEndereco").value.trim(),
        municipio: document.getElementById("vaMunicipio").value.trim(),
        observacoes: "Venda avulsa",
        loteId: state.ultimoLoteId || "",
        itens: itensValidos
      };

      var clienteExiste = state.clientes.some(function(cl){ return cl.nome.trim().toLowerCase() === cliente.toLowerCase(); });
      if(!clienteExiste){
        confirmModal(
          "Cliente não encontrado",
          "\""+escapeHtml(cliente)+"\" ainda não está cadastrado em Clientes. Deseja cadastrar esse cliente agora?",
          "Sim, cadastrar",
          function(){
            openClienteModal(
              { nome: payload.nome, telefone: payload.telefone, endereco: payload.endereco, municipio: payload.municipio },
              null,
              true
            );
          },
          false, null, true
        );
        return;
      }

      salvarVendaAvulsa(payload);
    });
  }

  function salvarVendaAvulsa(payload){
    var btn = document.getElementById("mSave");
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
    api("venderAvulso", payload).then(function(){
      toast("Venda avulsa registrada!");
      closeModal();
      loadPedidos();
      loadEstoque();
    }).catch(function(err){
      toast(err.message, "err");
      btn.disabled = false; btn.innerHTML = ICON.check + ' Registrar venda';
    });
  }

  // ---------------------------------------------------------------
  // HISTÓRICO DE RELAÇÕES DE VENDA (GTA) — filtrável
  // ---------------------------------------------------------------
  function filteredRelacoesVenda(){
    var de = state.histRelacaoDataDe ? new Date(state.histRelacaoDataDe + "T00:00:00") : null;
    var ate = state.histRelacaoDataAte ? new Date(state.histRelacaoDataAte + "T23:59:59") : null;
    return (state.relacoesVenda || []).filter(function(r){
      if(state.histRelacaoGta){
        var q = state.histRelacaoGta.toLowerCase();
        if(!String(r.gta||"").toLowerCase().startsWith(q)) return false;
      }
      if(de || ate){
        var d = parseDataCriacao(r.data);
        if(!d) return false;
        if(de && d < de) return false;
        if(ate && d > ate) return false;
      }
      return true;
    });
  }

  function renderHistoricoRelacoes(){
    var root = document.getElementById("viewHistoricoRelacoes");
    if(!root) return;

    var countRV = document.getElementById("countRelacoesVenda");
    if(countRV) countRV.textContent = (state.relacoesVenda||[]).length;

    var html = '';
    html += '<div class="toolbar">';
    html += '  <div class="search-box">'+ICON.search+'<input type="text" id="hrGta" placeholder="Buscar por código GTA" value="'+escapeHtml(state.histRelacaoGta)+'"></div>';
    html += '  <div class="spacer"></div>';
    html += '  <div class="date-range-group">';
    html += '  <label class="date-filter-label">De<input type="date" id="hrDataDe" value="'+escapeHtml(state.histRelacaoDataDe)+'"></label>';
    html += '  <label class="date-filter-label">Até<input type="date" id="hrDataAte" value="'+escapeHtml(state.histRelacaoDataAte)+'"></label>';
    html += '  </div>';
    if(state.histRelacaoGta || state.histRelacaoDataDe || state.histRelacaoDataAte){
      html += '  <button class="btn btn-sm" id="btnLimparHistRelacao">Limpar filtros</button>';
    }
    html += '</div>';

    html += '<div class="card">';
    if(state.loadingRelacoesVenda){
      html += '<div class="loading-row"><div class="spinner spinner-dark"></div>Carregando...</div>';
    } else {
      var list = filteredRelacoesVenda();
      if(list.length === 0){
        html += emptyState(ICON.box, "Nenhuma relação de venda encontrada", (state.relacoesVenda||[]).length===0 ? "As relações impressas vão aparecer aqui." : "Ajuste os filtros para ver outras relações.");
      } else {
        var somaValor = list.reduce(function(s,r){ return s + r.valorTotal; }, 0);
        html += '<div class="historico-total-row"><span>Valor total das relações filtradas</span><span class="historico-total-valor">'+formatMoeda(somaValor)+'</span></div>';
        list.forEach(function(r){
          var clientesUnicos = Array.from(new Set(r.itens.map(function(it){ return it.nome; })));
          var expandido = !!state.relacoesExpandidas[r.rowIndex];
          var dataSoData = (r.data||"").split(" ")[0];
          html += '<div class="historico-encomenda-item">';
          html += '<button type="button" class="historico-relacao-cabecalho" data-relacao-toggle="'+r.rowIndex+'">';
          html += '<span class="historico-relacao-gta">GTA: '+escapeHtml(r.gta)+'</span>';
          html += '<div style="display:flex;align-items:center;gap:12px;">';
          html += '<span class="historico-relacao-data-resumo">'+escapeHtml(dataSoData)+'</span>';
          html += '<span class="estoque-chevron'+(expandido?' expandido':'')+'">'+ICON.chevron+'</span>';
          html += '</div>';
          html += '</button>';
          if(expandido){
            html += '<div class="historico-relacao-detalhes">';
            html += '<div class="cell-sub" style="margin-bottom:6px;">Emitida em '+escapeHtml(r.data)+'</div>';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
            html += '<span class="cell-sub">'+clientesUnicos.length+' cliente(s) — <b>'+formatMoeda(r.valorTotal)+'</b></span>';
            html += '<div style="display:flex;gap:8px;">';
            html += '<button class="btn btn-icon btn-sm" data-act="reimprimir-relacao" data-row="'+r.rowIndex+'" title="Reimprimir" style="padding:5px;width:38px;height:38px;">'+ICON.printer+'</button>';
            html += '<button class="btn btn-icon btn-sm btn-danger-ghost" data-act="excluir-relacao" data-row="'+r.rowIndex+'" title="Excluir">'+ICON.trash+'</button>';
            html += '</div>';
            html += '</div>';
            html += r.itens.map(function(it){
              var sub = it.subtipo ? " ("+it.subtipo+")" : "";
              return '<div class="tipo-linha tipo-linha-gta"><span class="tipo-qtd">x'+it.qtd+'</span> <span class="tag '+tagClasseDe(it.categoria)+'">'+escapeHtml(it.especie||it.categoria)+escapeHtml(sub)+'</span> <span class="cell-sub">'+escapeHtml(it.nome)+'</span></div>';
            }).join("");
            html += '</div>';
          }
          html += '</div>';
        });
      }
    }
    html += '</div>';
    root.innerHTML = html;

    document.getElementById("hrGta").addEventListener("input", function(e){ state.histRelacaoGta = e.target.value; renderHistoricoRelacoes(); preserveFocus(document.getElementById("hrGta")); });
    document.getElementById("hrDataDe").addEventListener("change", function(e){ state.histRelacaoDataDe = e.target.value; renderHistoricoRelacoes(); });
    document.getElementById("hrDataAte").addEventListener("change", function(e){ state.histRelacaoDataAte = e.target.value; renderHistoricoRelacoes(); });
    var btnLimparHR = document.getElementById("btnLimparHistRelacao");
    if(btnLimparHR){
      btnLimparHR.addEventListener("click", function(){
        state.histRelacaoGta = ""; state.histRelacaoDataDe = ""; state.histRelacaoDataAte = "";
        renderHistoricoRelacoes();
      });
    }
    root.querySelectorAll('[data-act="reimprimir-relacao"]').forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var registro = (state.relacoesVenda||[]).filter(function(r){ return String(r.rowIndex) === btn.dataset.row; })[0];
        if(registro) reimprimirRelacao(registro);
      });
    });
    root.querySelectorAll('[data-act="excluir-relacao"]').forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var registro = (state.relacoesVenda||[]).filter(function(r){ return String(r.rowIndex) === btn.dataset.row; })[0];
        confirmModal("Excluir relação", "Excluir a relação GTA "+escapeHtml(registro?registro.gta:"")+" do histórico? Essa ação não pode ser desfeita.", "Excluir", function(){
          api("excluirRelacaoVenda", { rowIndex: Number(btn.dataset.row) }).then(function(data){
            state.relacoesVenda = data || [];
            toast("Relação excluída.");
            renderHistoricoRelacoes();
          }).catch(function(err){ toast(err.message, "err"); });
        }, true);
      });
    });
    root.querySelectorAll('[data-relacao-toggle]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var rowIndex = btn.dataset.relacaoToggle;
        state.relacoesExpandidas[rowIndex] = !state.relacoesExpandidas[rowIndex];
        renderHistoricoRelacoes();
      });
    });
  }

  // ---------------------------------------------------------------
  // VIEW: PEDIDOS (ativos)
  // ---------------------------------------------------------------
  function filteredPedidos(){
    return groupPedidos().filter(function(g){
      if(g.status !== "Ativo") return false;
      if(state.filtroCategoria !== "Todos" && !g.itens.some(function(it){ return it.categoria === state.filtroCategoria; })) return false;
      if(state.buscaPedidos){
        var q = state.buscaPedidos.toLowerCase();
        var hay = (g.nome + " " + g.municipio + " " + g.itens.map(function(it){ return it.subtipo||""; }).join(" ")).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function(a,b){ return (a.nome||"").localeCompare(b.nome||""); });
  }

  function buildPedidoRowsHtml(list, showStatusCol){

    html += '<th>Cliente</th><th>Tipos de ave</th><th>Qtd total</th><th>Município</th><th>Valor</th>';

    html += '<th>Data</th><th></th>';

    list.forEach(function(g){
      var statusBadge = g.status === "Encerrado"
        ? '<span class="badge badge-encerrado">Encerrado</span>'
        : '<span class="badge badge-ativo">Ativo</span>';
      var tipos = g.itens.map(function(it){
        var sub = it.subtipo ? ' <span class="cell-sub">('+escapeHtml(it.subtipo)+')</span>' : '';
        return '<div class="tipo-linha"><span class="tipo-qtd">x'+it.qtd+'</span> <span class="tag '+tagClasseDe(it.categoria)+'" title="'+escapeHtml(it.categoria)+'">'+escapeHtml(abreviarCategoria(it.categoria))+'</span>'+sub+'</div>';
      }).join("");
      html += '<tr>';
      html += '<td data-label="Cliente"><div>'+escapeHtml(g.nome)+'</div><div class="cell-sub">'+escapeHtml(g.telefone||"")+'</div></td>';

      html += '<td data-label="Qtd total">'+g.qtdTotal+'</td>';
      html += '<td data-label="Município">'+escapeHtml(g.municipio||"")+'</td>';
      html += '<td data-label="Valor"><b>'+formatMoeda(g.valorTotal)+'</b></td>';
      if(showStatusCol) html += '<td data-label="Status">'+statusBadge+'</td>';
      html += '<td data-label="Data" class="cell-sub">'+escapeHtml(g.dataCriacao||"")+'</td>';
      html += '<td><div class="row-actions">';
      var waLink = buildWhatsAppLink(g);
      if(waLink){
        html += '<button class="btn btn-icon btn-sm btn-whatsapp" data-wa="'+encodeURIComponent(waLink)+'" title="Enviar mensagem no WhatsApp">'+ICON.whatsapp+'</button>';
      }
      html += '<button class="btn btn-icon btn-sm" data-act="edit-pedido" data-pid="'+encodeURIComponent(g.pedidoId)+'" title="Editar">'+ICON.edit+'</button>';
      if(g.status === "Encerrado"){
        html += '<button class="btn btn-icon btn-sm" data-act="reabrir" data-pid="'+encodeURIComponent(g.pedidoId)+'" title="Reabrir pedido">'+ICON.undo+'</button>';
      } else {
        html += '<button class="btn btn-icon btn-sm btn-success-ghost" data-act="encerrar" data-pid="'+encodeURIComponent(g.pedidoId)+'" title="Encerrar pedido">'+ICON.check+'</button>';

  function wirePedidoRowActions(root){
    root.querySelectorAll('[data-wa]').forEach(function(btn){
      btn.addEventListener("click", function(){ abrirExterno(decodeURIComponent(btn.dataset.wa)); });
    });
    root.querySelectorAll('[data-act="edit-pedido"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = findPedidoGroup(decodeURIComponent(btn.dataset.pid));
        if(g) openPedidoModal(g);
      });
    });
    root.querySelectorAll('[data-act="encerrar"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = findPedidoGroup(decodeURIComponent(btn.dataset.pid));
        if(!g) return;

        // Confere se tem ave suficiente em estoque antes de nem oferecer
        // a opção de encerrar.
        var necessarioPorCategoria = {};
        g.itens.forEach(function(it){
          necessarioPorCategoria[it.categoria] = (necessarioPorCategoria[it.categoria]||0) + it.qtd;
        });
        var faltando = Object.keys(necessarioPorCategoria).filter(function(categoria){
          var disponivel = Number(state.estoque[categoria]) || 0;
          return necessarioPorCategoria[categoria] > disponivel;
        });
        if(faltando.length > 0){
          toast('Não tem ave suficiente em estoque pra encerrar: ' + faltando.map(function(c){
            return c + ' (precisa ' + necessarioPorCategoria[c] + ', tem ' + (Number(state.estoque[c])||0) + ' sobrando)';
          }).join('; ') + '.', "err");
          return;
        }

        var mensagem = "Encerrar pedido de " + g.nome + "? Pedidos encerrados esperam na aba GTA até terminar de vender todas as aves, pra aí gerar a guia de transporte.";

        confirmModal("Encerrar pedido", mensagem, "Encerrar", function(){
          api("encerrarPedido", { pedidoId: g.pedidoId }).then(function(){
            toast("Pedido encerrado.");
            loadPedidos();
            loadEstoque();
          }).catch(function(err){ toast(err.message, "err"); });
        });
      });
    });
    root.querySelectorAll('[data-act="reabrir"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = findPedidoGroup(decodeURIComponent(btn.dataset.pid));
        api("reabrirPedido", { pedidoId: g.pedidoId }).then(function(){
          toast("Pedido reaberto.");
          loadPedidos();
          loadEstoque();
        }).catch(function(err){ toast(err.message, "err"); });
      });
    });
    root.querySelectorAll('[data-act="del-pedido"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = findPedidoGroup(decodeURIComponent(btn.dataset.pid));
        confirmModal("Remover pedido", "Remover o pedido de " + (g?g.nome:"") + " da planilha? Essa ação não pode ser desfeita.", "Remover", function(){
          var pedidoId = g.pedidoId;
          // Some da tela na hora, sem esperar a planilha confirmar.
          state.pedidos = state.pedidos.filter(function(p){ return p.pedidoId !== pedidoId; });
          renderPedidos();
          renderHistorico();
          toast("Pedido removido.");
          api("deletePedido", { pedidoId: pedidoId }).then(function(){
            loadEstoque(); // se era um pedido encerrado, devolve a quantidade pro estoque
          }).catch(function(err){
            toast("Não foi possível remover: " + err.message, "err");
            loadPedidos();
          });
        }, true);
      });
    });
  }

  function filteredHistorico(){
    var de = state.histDataDe ? new Date(state.histDataDe + "T00:00:00") : null;
    var ate = state.histDataAte ? new Date(state.histDataAte + "T23:59:59") : null;
    return groupPedidos().filter(function(g){
      // Encerrados que ainda esperam por uma GTA ficam só na aba GTA,
      // não aparecem aqui até a relação ser impressa.
      if(g.status === "Encerrado" && g.temLotePendente) return false;
      if(state.histCategoria !== "Todos" && !g.itens.some(function(it){ return it.categoria === state.histCategoria; })) return false;
      if(state.histStatus !== "Todos" && g.status !== state.histStatus) return false;
      if(state.histBusca){
        var q = state.histBusca.toLowerCase();
        var hay = (g.nome + " " + g.municipio + " " + g.itens.map(function(it){ return it.subtipo||""; }).join(" ") + " " + (g.observacoes||"")).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      if(de || ate){
        var d = parseDataCriacao(g.dataCriacao);
        if(!d) return false;
        if(de && d < de) return false;
        if(ate && d > ate) return false;
      }
      return true;
    }).sort(function(a,b){
      var da = parseDataCriacao(a.dataCriacao), db = parseDataCriacao(b.dataCriacao);
      if(da && db && da.getTime() !== db.getTime()) return db - da;
      return (a.nome||"").localeCompare(b.nome||"");
    });
  }

  function wirePedidoPlantaRowActions(root){
    root.querySelectorAll('[data-wa]').forEach(function(btn){
      btn.addEventListener("click", function(){ abrirExterno(decodeURIComponent(btn.dataset.wa)); });
    });
    root.querySelectorAll('[data-act="edit-pedido-planta"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = findPedidoPlantaGroup(decodeURIComponent(btn.dataset.pid));
        if(g) openPedidoPlantaModal(g);
      });
    });
    root.querySelectorAll('[data-act="encerrar-planta"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = findPedidoPlantaGroup(decodeURIComponent(btn.dataset.pid));
        confirmModal("Encerrar pedido", "Encerrar o pedido de " + (g?g.nome:"") + "? Ele continua no histórico, marcado como encerrado.", "Encerrar", function(){
          api("encerrarPedidoPlanta", { pedidoId: g.pedidoId }).then(function(){
            toast("Pedido encerrado.");
            loadPedidosPlantas();
          }).catch(function(err){ toast(err.message, "err"); });
        });
      });
    });
    root.querySelectorAll('[data-act="reabrir-planta"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = findPedidoPlantaGroup(decodeURIComponent(btn.dataset.pid));
        api("reabrirPedidoPlanta", { pedidoId: g.pedidoId }).then(function(){
          toast("Pedido reaberto.");
          loadPedidosPlantas();
        }).catch(function(err){ toast(err.message, "err"); });
      });
    });
    root.querySelectorAll('[data-act="del-pedido-planta"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var g = findPedidoPlantaGroup(decodeURIComponent(btn.dataset.pid));
        confirmModal("Remover pedido", "Remover o pedido de " + (g?g.nome:"") + " da planilha? Essa ação não pode ser desfeita.", "Remover", function(){
          var pedidoId = g.pedidoId;

          renderPlantasPedidos();
          renderPlantasHistorico();

            toast("Não foi possível remover: " + err.message, "err");
            loadPedidosPlantas();
          });
        }, true);
      });
    });
  }

  function plantaOptionsAgrupadas(selecionado){
    var semCategoria = state.plantas.filter(function(p){ return !p.categoria; });

    state.plantas.forEach(function(p){
      if(!p.categoria) return;
      if(!porCategoria[p.categoria]) porCategoria[p.categoria] = [];
      porCategoria[p.categoria].push(p);
    });
    var html = "";
    Object.keys(porCategoria).sort().forEach(function(cat){
      html += '<optgroup label="'+escapeHtml(cat)+'">';
      porCategoria[cat].forEach(function(pl){
        html += '<option value="'+escapeHtml(pl.nome)+'"'+(pl.nome===selecionado?' selected':'')+'>'+escapeHtml(pl.nome)+'</option>';
      });
      html += '</optgroup>';

      html += '<optgroup label="Sem categoria">';

      });

  function importarListaDePrecos(){
    var jaExistentes = new Set(state.plantas.map(function(p){ return p.nome.trim().toLowerCase(); }));
    var novos = LISTA_PRECOS_AGRO_BENEVENUTO.filter(function(item){ return !jaExistentes.has(item.nome.trim().toLowerCase()); });
    var repetidos = LISTA_PRECOS_AGRO_BENEVENUTO.length - novos.length;

    if(novos.length === 0){
      toast("Todas as plantas dessa lista já estão cadastradas.");
      return;
    }

    var corpo = "Isso vai cadastrar <b>"+novos.length+"</b> tipos de planta"
      + (repetidos > 0 ? " (" + repetidos + " já cadastrados serão pulados)" : "")
      + ", com preços da lista da Agro Benevenuto (Safra 2026), agrupados por categoria (Laranjeiras, Bergamoteiras, Ornamentais, etc). Continuar?";

    confirmModal("Importar lista de preços", corpo, "Importar", function(){
      var btn = null;
      toast("Importando " + novos.length + " itens...");
      api("bulkAddPlantas", { itens: novos }).then(function(){
        toast("Lista importada com sucesso!");
        loadPlantas();
      }).catch(function(err){
        toast(err.message, "err");
      });
    });
  }

  function renderCadastroPlantas(){
    var root = document.getElementById("viewPlantasCadastro");
    if(!root) return;
    var html = '';
    html += '<div class="toolbar">';
    html += '  <div class="search-box">'+ICON.search+'<input type="text" id="cpBusca" placeholder="Buscar tipo de planta" value="'+escapeHtml(state.buscaCadastroPlanta)+'"></div>';
    html += '  <div class="date-range-group">';
    html += '  <label class="date-filter-label">Preço de<input type="text" inputmode="decimal" id="cpPrecoMin" style="width:90px;" value="'+escapeHtml(state.cadastroPrecoMin)+'"></label>';
    html += '  <label class="date-filter-label">até<input type="text" inputmode="decimal" id="cpPrecoMax" style="width:90px;" value="'+escapeHtml(state.cadastroPrecoMax)+'"></label>';
    html += '  </div>';
    html += '  <div class="spacer"></div>';
    html += '  <button class="btn btn-primary" id="btnNovaPlanta">'+ICON.plus+' Novo tipo de planta</button>';
    html += '</div>';

    var filtroAtivo = !!(state.buscaCadastroPlanta || state.cadastroPrecoMin !== "" || state.cadastroPrecoMax !== "");

    function buildTabelaPlantas(itens, mostrarCategoria){
      var t = '<table><thead><tr><th>Nome</th>'+(mostrarCategoria?'<th>Categoria</th>':'')+'<th>Preço/unidade</th><th></th></tr></thead><tbody>';
      itens.forEach(function(p){
        t += '<tr>';
        t += '<td data-label="Nome">'+escapeHtml(p.nome)+'</td>';
        if(mostrarCategoria) t += '<td data-label="Categoria">'+(p.categoria?'<span class="tag '+categoriaTagClasse(p.categoria)+'">'+escapeHtml(p.categoria)+'</span>':'<span class="cell-sub">—</span>')+'</td>';
        t += '<td data-label="Preço/unidade">'+formatMoeda(p.preco)+'</td>';
        t += '<td><div class="row-actions">';
        t += '<button class="btn btn-icon btn-sm" data-act="edit-planta" data-row="'+p.rowIndex+'" title="Editar">'+ICON.edit+'</button>';
        t += '<button class="btn btn-icon btn-sm btn-danger-ghost" data-act="del-planta" data-row="'+p.rowIndex+'" title="Remover">'+ICON.trash+'</button>';
        t += '</div></td>';
        t += '</tr>';
      });
      t += '</tbody></table>';
      return t;
    }

    if(state.loadingPlantas){
      html += '<div class="card"><div class="loading-row"><div class="spinner spinner-dark"></div>Carregando...</div></div>';
    } else {
      var list = filteredCadastroPlantas();
      if(list.length === 0){
        html += '<div class="card">'+emptyState(ICON.stock, "Nenhum tipo de planta encontrado", state.plantas.length===0 ? "Cadastre o primeiro tipo de planta e seu preço para começar a lançar pedidos." : "Ajuste os filtros para ver outros tipos.")+'</div>';
      } else if(filtroAtivo){
        // Filtro ativo: mostra tudo que bateu, numa lista só, sem os dropdowns por categoria.
        html += '<div class="card">'+buildTabelaPlantas(list, true)+'</div>';
      } else {
        var porCategoria = {};
        var semCategoria = [];
        list.forEach(function(p){
          if(!p.categoria){ semCategoria.push(p); return; }
          if(!porCategoria[p.categoria]) porCategoria[p.categoria] = [];
          porCategoria[p.categoria].push(p);
        });

        Object.keys(porCategoria).sort().forEach(function(cat){
          var itens = porCategoria[cat];
          var expandido = !!state.categoriasExpandidasPlantas[cat];
          html += '<div class="card categoria-planta-card">';
          html += '<button type="button" class="estoque-head" data-cat-toggle="'+encodeURIComponent(cat)+'">';
          html += '<div><span class="tag '+categoriaTagClasse(cat)+'">'+escapeHtml(cat)+'</span> <span class="cell-sub">'+itens.length+' tipo'+(itens.length===1?'':'s')+'</span></div>';

  function dataDeHojeISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function converterParaISO(dataBr){
    if(!dataBr) return "";
    var partes = dataBr.split("/");
    if(partes.length !== 3) return "";
    return partes[2] + "-" + partes[1] + "-" + partes[0];
  }

  function calcularDiasAluguel(dataInicioStr, dataFimStr){
    var di = parseDataCriacao(dataInicioStr);
    var df = parseDataCriacao(dataFimStr);
    if(!di || !df) return 1;
    var diff = Math.round((df - di) / 86400000);
    return Math.max(1, diff);
  }

  function buildMaquinasComStatus(){
    return state.maquinas.map(function(m){
      var aluguelAtivo = state.alugueis.filter(function(a){ return a.maquina === m.nome && (a.status||"Ativo") === "Ativo"; })[0];
      if(aluguelAtivo){
        var dias = calcularDiasAluguel(aluguelAtivo.dataInicio, aluguelAtivo.dataFim);
        var valor = dias * (Number(m.valorDia)||0);
        return { maquina: m, alugada: true, aluguel: aluguelAtivo, dias: dias, valor: valor };
      }
      return { maquina: m, alugada: false };
    }).sort(function(a,b){ return (a.maquina.nome||"").localeCompare(b.maquina.nome||""); });
  }

        confirmModal("Marcar como devolvida", "Marcar a máquina \""+escapeHtml(a?a.maquina:"")+"\" como devolvida? Ela volta a aparecer como Disponível.", "Marcar devolvida", function(){

          document.getElementById("alEndereco").value = c.endereco || "";

      if(!cliente){ toast("Informe o nome do cliente.", "err"); return; }
      var dataInicio = document.getElementById("alDataInicio").value;
      var dataFim = document.getElementById("alDataFim").value;
      if(!dataInicio || !dataFim){ toast("Informe as duas datas.", "err"); return; }
      if(dataFim < dataInicio){ toast("A data de devolução não pode ser antes da data de início.", "err"); return; }

      var payload = {
        rowIndex: editing ? aluguel.rowIndex : undefined,
        maquina: document.getElementById("alMaquina").value,
        cliente: cliente,
        telefone: document.getElementById("alTelefone").value.trim(),
        endereco: document.getElementById("alEndereco").value.trim(),
        municipio: document.getElementById("alMunicipio").value.trim(),
        dataInicio: dataInicio,

      };

        var clienteExiste = state.clientes.some(function(cl){ return cl.nome.trim().toLowerCase() === cliente.toLowerCase(); });
        if(!clienteExiste){
          confirmModal(

            },

          return;
        }
      }

      salvarAluguel(payload, editing);
    });

      loadAlugueis();
    }).catch(function(err){
      toast(err.message, "err");
      btn.disabled = false; btn.textContent = editing ? "Salvar alterações" : "Registrar aluguel";
    });
  }

  // ---- Aba Histórico (aluguéis) ----
  function filteredHistoricoMaquinas(){
    var de = state.histDataDeMaquina ? new Date(state.histDataDeMaquina + "T00:00:00") : null;
    var ate = state.histDataAteMaquina ? new Date(state.histDataAteMaquina + "T23:59:59") : null;
    return state.alugueis.filter(function(a){
      if(state.histMaquina !== "Todos" && a.maquina !== state.histMaquina) return false;
      if(state.histStatusMaquina !== "Todos" && (a.status||"Ativo") !== state.histStatusMaquina) return false;
      if(state.histClienteMaquina){
        var q = state.histClienteMaquina.toLowerCase();
        if((a.cliente||"").toLowerCase().indexOf(q) === -1) return false;
      }
      if(de || ate){
        var d = parseDataCriacao(a.dataInicio);
        if(!d) return false;
        if(de && d < de) return false;
        if(ate && d > ate) return false;
      }
      return true;
    }).map(function(a){
      var maq = state.maquinas.filter(function(m){ return m.nome === a.maquina; })[0];
      var valorDia = maq ? Number(maq.valorDia)||0 : 0;
      var dias = calcularDiasAluguel(a.dataInicio, a.dataFim);
      return { aluguel: a, dias: dias, valor: dias * valorDia };
    }).sort(function(x,y){
      var dx = parseDataCriacao(x.aluguel.dataInicio), dy = parseDataCriacao(y.aluguel.dataInicio);
      if(dx && dy && dx.getTime() !== dy.getTime()) return dy - dx;
      return (x.aluguel.cliente||"").localeCompare(y.aluguel.cliente||"");
    });
  }

        list.forEach(function(item){

          html += '</div></td>';
          html += '</tr>';
        });

    root.innerHTML = html;

    document.getElementById("hmStatus").addEventListener("change", function(e){ state.histStatusMaquina = e.target.value; renderHistoricoMaquinas(); });
    var hmCliente = document.getElementById("hmCliente");
    hmCliente.addEventListener("input", function(e){ state.histClienteMaquina = e.target.value; renderHistoricoMaquinas(); preserveFocus(hmCliente); });
    document.getElementById("hmDataDe").addEventListener("change", function(e){ state.histDataDeMaquina = e.target.value; renderHistoricoMaquinas(); });
    document.getElementById("hmDataAte").addEventListener("change", function(e){ state.histDataAteMaquina = e.target.value; renderHistoricoMaquinas(); });
    var btnLimparHM = document.getElementById("btnLimparHistMaquina");
    if(btnLimparHM){
      btnLimparHM.addEventListener("click", function(){
        state.histMaquina = "Todos"; state.histStatusMaquina = "Todos"; state.histClienteMaquina = ""; state.histDataDeMaquina = ""; state.histDataAteMaquina = "";
        renderHistoricoMaquinas();
      });

    root.querySelectorAll('[data-act="edit-aluguel-h"]').forEach(function(btn){
      btn.addEventListener("click", function(){
